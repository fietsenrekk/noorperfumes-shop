<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank you — NOOR PERFUMES</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@0,300;0,400;0,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="header-frame-wrap">
    <a href="/" class="header-frame">
      <div class="header-frame-inner"><p class="brand-title">Noor Perfumes</p></div>
    </a>
  </div>
</header>

<main class="wrap">
  <section class="page-body" style="text-align:center; max-width:560px; margin:0 auto; padding:70px 24px 100px">
    <div class="page-kicker">Order received</div>
    <h1 style="margin-bottom:18px">Thank you</h1>
    <p class="page-lede" id="msg">We're confirming your payment…</p>
    <p style="margin-top:30px"><a class="no-results-clear" style="display:inline-block; text-decoration:none; padding:12px 30px" href="/">Back to the shop</a></p>
  </section>
</main>

<script>
  // The order status is set by Mollie's server-to-server webhook, so we just
  // reassure the customer here. A follow-up e-mail (Supabase trigger / Resend)
  // is the place to send the real confirmation.
  var params = new URLSearchParams(location.search);
  var order = params.get("order");
  var msg = document.getElementById("msg");
  if (order) {
    msg.textContent = "Your order is placed. You'll receive a confirmation by e-mail shortly. Reference: " + order.slice(0, 8).toUpperCase();
  } else {
    msg.textContent = "Your order is placed. You'll receive a confirmation by e-mail shortly.";
  }
</script>
</body>
</html>
